<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سلة التسوق</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:30px;
}

.container{
max-width:700px;
margin:auto;
background:#fff;
padding:30px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,.1);
}

h1{
text-align:center;
margin-bottom:30px;
}

.item{
display:flex;
justify-content:space-between;
padding:15px 0;
border-bottom:1px solid #ddd;
}

.total{
font-size:24px;
margin-top:30px;
text-align:center;
font-weight:bold;
}

button{
width:100%;
padding:15px;
background:black;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
margin-top:20px;
}

button:hover{
background:#444;
}
</style>

</head>

<body>

<div class="container">

<h1>🛒 سلة التسوق</h1>

<div id="cart"></div>

<div class="total">
الإجمالي:
<span id="total">0</span>
د.ك
</div>

<button onclick="alert('تم استلام طلبك بنجاح')">
إتمام الدفع
</button>

</div>

<script>

let cart=JSON.parse(localStorage.getItem("cart"))||[];

let cartDiv=document.getElementById("cart");

let total=0;

cart.forEach(item=>{

cartDiv.innerHTML+=`
<div class="item">
<span>${item.name}</span>
<span>${item.price} د.ك</span>
</div>
`;

total+=item.price;

});

document.getElementById("total").innerHTML=total;

</script>

</body>
</html>
