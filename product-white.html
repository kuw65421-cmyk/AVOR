<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVOR White</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f8f5ef;
    margin:0;
    text-align:center;
}

.container{
    padding:60px 20px;
}

img{
    width:350px;
    max-width:90%;
    border-radius:20px;
}

h1{
    margin-top:30px;
    font-size:40px;
}

p{
    font-size:22px;
}

.price{
    font-size:28px;
    font-weight:bold;
    margin:20px 0;
}

.buy{
    display:inline-block;
    background:#000;
    color:#fff;
    text-decoration:none;
    padding:15px 40px;
    border-radius:40px;
}

.back{
    display:block;
    margin-top:30px;
    color:#000;
    text-decoration:none;
}
</style>

</head>

<body>

<div class="container">

<img src="white.jpeg" alt="AVOR White">

<h1>عبوة AVOR البيضاء</h1>

<p>
زجاجة ستانلس ستيل عالية الجودة وتحافظ على حرارة وبرودة المشروب.
</p>

<div class="price">
10.5 د.ك
</div>
<label>المقاس</label><br>

<select id="size">
    <option>S</option>
    <option>M</option>
    <option>L</option>
    <option>XL</option>
</select>

<br><br>

<label>الكمية</label><br>

<input type="number" id="quantity" value="1" min="1">

<br><br>
<button class="buy" onclick="addToCart()">إضافة إلى السلة</button>

<a href="index.html" class="back">العودة للرئيسية</a>

</div>
<script>
function addToCart() {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    cart.push({
        name: "AVOR أبيض",
        price: 10.5
    });

    localStorage.setItem("cart", JSON.stringify(cart));

    window.location.href = "cart.html";
}
</script>
</body>
</html>
