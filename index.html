<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AVOR</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f8f5ef;
color:#222;
}

.hero{
position:relative;
height:100vh;
overflow:hidden;
}

.hero img{
width:100%;
height:100%;
object-fit:cover;
}

.overlay{
position:absolute;
left:8%;
bottom:15%;
display:flex;
flex-direction:column;
align-items:flex-start;
gap:20px;
}

.button{
background:#111;
color:#fff;
padding:16px 42px;
text-decoration:none;
border-radius:50px;
font-size:20px;
transition:.3s;
}

.button:hover{
background:#444;
}

.products{
padding:80px 8%;
background:white;
}

.products h2{
text-align:center;
font-size:42px;
margin-bottom:50px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:30px;
}

.card{
background:#fff;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,.12);
transition:.3s;
text-align:center;
}

.card:hover{
transform:translateY(-8px);
}

.card img{
width:100%;
display:block;
}

.card h3{
margin-top:20px;
font-size:28px;
}

.price{
font-size:24px;
margin:15px 0;
font-weight:bold;
}

.buy{
display:inline-block;
margin-bottom:25px;
padding:14px 35px;
background:black;
color:white;
text-decoration:none;
border-radius:40px;
}

footer{
background:#111;
color:white;
text-align:center;
padding:35px;
margin-top:60px;
}

</style>
</head>

<body>

<section class="hero">

<img src="hero.jpg">

<div class="overlay">

<a href="#products" class="button">
تسوق الآن
</a>

</div>

</section>

<section class="products" id="products">

<h2>منتجات AVOR</h2>

<div class="grid">
    <div class="card">
    <img src="white.jpg" alt="AVOR White">
    <h3>تيشيرت AVOR أبيض</h3>
    <div class="price">10.5 د.ك</div>
    <a href="#" class="buy">شراء</a>
</div>

<div class="card">
    <img src="black.jpg" alt="AVOR Black">
    <h3>تيشيرت AVOR أسود</h3>
    <div class="price">10.5 د.ك</div>
    <a href="#" class="buy">شراء</a>
</div>

<div class="card">
    <img src="gray.jpg" alt="AVOR Gray">
    <h3>تيشيرت AVOR رمادي</h3>
    <div class="price">10.5 د.ك</div>
    <a href="#" class="buy">شراء</a>
</div>

</div>
</section>

<footer>
© 2026 AVOR - جميع الحقوق محفوظة
</footer>

</body>
</html>
