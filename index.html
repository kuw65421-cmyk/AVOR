<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:#f5f1ea;
color:#222;
}

.hero{
position:relative;
height:100vh;
overflow:hidden;
}

.hero img{
width:100%;
height:100%;
object-fit:cover;
}

.overlay{
    position:absolute;
    top:40%;
    left:8%;
    transform:translateY(-50%);
    z-index:10;
    color:white;
}

.logo{
font-size:80px;
letter-spacing:10px;
font-weight:bold;
margin-bottom:15px;
}

.slogan{
font-size:32px;
margin-bottom:35px;
}

.button{
display:inline-block;
padding:16px 40px;
background:#111;
color:#fff;
text-decoration:none;
border-radius:50px;
font-size:20px;
transition:.3s;
  margin-top:30px;
}

.button:hover{
background:#444;
}

.products{
padding:80px 10%;
background:#fff;
text-align:center;
}

.products h2{
font-size:45px;
margin-bottom:50px;
}

.cards{
display:flex;
gap:30px;
justify-content:center;
flex-wrap:wrap;
}

.card{
width:300px;
border-radius:18px;
overflow:hidden;
background:#fafafa;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.card img{
width:100%;
height:320px;
object-fit:cover;
}

.card h3{
padding:20px 0 10px;
font-size:25px;
}

.card p{
font-size:22px;
margin-bottom:20px;
}

.buy{
display:inline-block;
margin-bottom:25px;
padding:12px 30px;
background:#111;
color:#fff;
text-decoration:none;
border-radius:30px;
}

footer{
background:#111;
color:#fff;
padding:35px;
text-align:center;
margin-top:70px;
}

@media(max-width:900px){

.logo{
font-size:55px;
}

.slogan{
font-size:24px;
}

.hero{
height:70vh;
}

}

</style>

</head>

<body>

<section class="hero">

<img src="hero.jpg">

<div class="overlay">



<div class="welcome">
  <h1>AVOR</h1>
    <h2>مرحباً بك في AVOR</h2>
</div>
  
</div>    


<div class="slogan">
    هدية ترندي 🤍 KW
</div>

<a class="button" href="#products">تسوق الآن</a>

</div>

<a class="button" href="#products">
تسوق الآن
</a>

</div>

</section>

<section class="products" id="products">

<h2>منتجاتنا</h2>

<div class="cards">

<div class="card">
<img src="white.jpg">
<h3>تيشيرت أبيض</h3>
<p>12 KWD</p>
<a class="buy" href="#">اطلب الآن</a>
</div>

<div class="card">
<img src="black.jpg">
<h3>تيشيرت أسود</h3>
<p>12 KWD</p>
<a class="buy" href="#">اطلب الآن</a>
</div>

<div class="card">
<img src="gray.jpg">
<h3>تيشيرت رمادي</h3>
<p>12 KWD</p>
<a class="buy" href="#">اطلب الآن</a>
</div>

</div>

</section>

<footer>

© 2026 AVOR جميع الحقوق محفوظة

</footer>

</body>
</html>
